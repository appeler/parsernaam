name: test

on:
  push:
  pull_request:
  workflow_dispatch:  # 👈 manually trigger from GitHub UI

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "auto"

      - name: Install project with test dependencies
        run: |
          uv sync --dev

      - name: Verify test dependencies
        run: |
          uv run python -c "import pytest; print(f'pytest version: {pytest.__version__}')"
          uv run python -c "import pytest_cov; print(f'pytest-cov available')" || echo "pytest-cov not found"
          uv pip list | grep pytest

      - name: Run tests with pytest
        run: uv run pytest

      - name: Show NumPy version
        run: uv run python -c "import numpy; print('NumPy version:', numpy.__version__)"
