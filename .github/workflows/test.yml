name: test

on:
  push:
  pull_request:
  workflow_dispatch:  # 👈 manually trigger from GitHub UI

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Install test dependencies
        run: |
          pip install pytest>=7.0 pytest-cov>=4.0 pytest-xdist>=3.0

      - name: Install project in editable mode
        run: |
          pip install -e .

      - name: Verify test dependencies
        run: |
          python -c "import pytest; print(f'pytest version: {pytest.__version__}')"
          python -c "import pytest_cov; print(f'pytest-cov available')" || echo "pytest-cov not found"
          pip list | grep pytest

      - name: Run tests with pytest
        run: pytest

      - name: Show NumPy version
        run: python -c "import numpy; print('NumPy version:', numpy.__version__)"
