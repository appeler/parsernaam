[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "parsernaam"
version = "0.4.0"
description = "ML-assisted first/last ordering for name strings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Rajashekar Chintalapati", email = "rajshekar.ch@gmail.com" },
  { name = "Gaurav Sood", email = "gsood07@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities"
]
keywords = ["name-parser", "names", "machine-learning", "nlp", "lstm", "pytorch"]
dependencies = [
  "torch>=2.13,<3",
  "safetensors>=0.7,<1",
  "pandas>=3,<4",
  "huggingface-hub>=1.27",
  "pyarrow>=25",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
web = [
    "gradio>=6.24,<7",
]

[dependency-groups]
train = ["numpy>=2", "pyarrow>=25"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-xdist>=3.0", "ruff>=0.7.0", "pre-commit>=3.0", "pyright>=1.1.390", "pydoclint>=0.5"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/appeler/parsernaam"
Documentation = "https://appeler.github.io/parsernaam/"
Repository = "https://github.com/appeler/parsernaam"
Issues = "https://github.com/appeler/parsernaam/issues"
Changelog = "https://github.com/appeler/parsernaam/blob/main/CHANGELOG.md"

[project.scripts]
parse_names = "parsernaam.parse:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "B008", "C901", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["-ra", "--strict-markers", "--cov", "--cov-report=term-missing", "-m", "not live", "--strict-config", "--cov-fail-under=95"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: downloads the pinned Hugging Face artifacts",
]

# mypy configuration
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
[tool.coverage.run]
source = ["src/parsernaam"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Deptry configuration  
[tool.deptry]
extend_exclude = ["docs", "htmlcov"]
known_first_party = ["parsernaam"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv.build-backend]
module-name = "parsernaam"
module-root = "src"
