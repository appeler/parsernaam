[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "parsernaam"
dynamic = ["version"]
description = "ML-assisted name parser for Indian and international names"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Rajashekar Chintalapati", email = "rajshekar.ch@gmail.com" },
  { name = "Gaurav Sood", email = "gsood07@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities"
]
keywords = ["name-parser", "names", "machine-learning", "nlp", "indian-names", "lstm", "pytorch"]
dependencies = [
  "torch>=2.0.1",
  "pandas>=1.5.0",
  "huggingface-hub>=0.23",
  "pyarrow>=14.0.0"
]
license-files = ["LICENSE"]

[project.optional-dependencies]
web = [
    "gradio>=4.0",
]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-xdist>=3.0", "ruff>=0.7.0", "pre-commit>=3.0", "pyright>=1.1.390", "pydoclint>=0.5"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/appeler/parsernaam"
Documentation = "https://appeler.github.io/parsernaam/"
Repository = "https://github.com/appeler/parsernaam"
Issues = "https://github.com/appeler/parsernaam/issues"
Changelog = "https://github.com/appeler/parsernaam/blob/main/CHANGELOG.md"

[project.scripts]
parse_names = "parsernaam.parse:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.hatch.build.targets.wheel]
packages = ["parsernaam"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["model_training"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "B008", "C901", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=parsernaam",
    "--cov-report=term-missing",
    "-m",
    "not live",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: downloads the pinned Hugging Face artifacts",
]

# mypy configuration
[tool.coverage.run]
source = ["parsernaam"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Deptry configuration  
[tool.deptry]
extend_exclude = ["model_training"]

[tool.deptry.per_rule_ignores]
DEP003 = ["google"]  # google.colab is transitive dependency in notebooks

[tool.pyright]
include = ["parsernaam"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
